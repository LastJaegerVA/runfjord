<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2540"/><stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46e3c4"/><stop offset=".5" stop-color="#3b8cf5"/><stop offset="1" stop-color="#7a63ff"/>
    </linearGradient>
    <clipPath id="tileclip"><rect x="64" y="64" width="896" height="896" rx="216"/></clipPath>
    <clipPath id="seaclip"><path id="seaPath" d="M64 300 C150 300 220 318 300 346 L770 476 Q820 492 770 548 L300 678 C220 706 150 724 64 724 Z"/></clipPath>
  </defs>
  <g clip-path="url(#tileclip)">
    <rect x="64" y="64" width="896" height="896" fill="url(#land)"/>
    <!-- topographic contour lines on the land, hugging the fjord -->
    <g fill="none" stroke="#5b6fa3" stroke-linecap="round" stroke-opacity=".45" stroke-width="10">
      <path d="M64 250 C160 250 240 270 320 296 L860 446"/>
      <path d="M64 196 C170 196 260 220 340 246 L940 412"/>
      <path d="M64 142 C180 142 280 168 360 196 L960 360"/>
      <path d="M64 774 C160 774 240 754 320 728 L860 578"/>
      <path d="M64 828 C170 828 260 804 340 778 L940 612"/>
      <path d="M64 882 C180 882 280 856 360 828 L960 664"/>
    </g>
    <!-- the fjord = play shape -->
    <path d="M64 300 C150 300 220 318 300 346 L770 476 Q820 492 770 548 L300 678 C220 706 150 724 64 724 Z" fill="url(#sea)"/>
    <!-- shoreline highlight -->
    <path d="M64 300 C150 300 220 318 300 346 L770 476 Q820 492 770 548 L300 678 C220 706 150 724 64 724" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="6"/>
    <!-- waves / code lines -->
    <g clip-path="url(#seaclip)" fill="#ffffff">
      <rect x="150" y="430" width="300" height="34" rx="17" fill-opacity=".92"/>
      <rect x="150" y="495" width="420" height="34" rx="17" fill-opacity=".7"/>
      <rect x="150" y="560" width="220" height="34" rx="17" fill-opacity=".5"/>
    </g>
  </g>
  <rect x="66" y="66" width="892" height="892" rx="214" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="4"/>
</svg>
