name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/pty-smoke.js
      - name: Syntax check
        run: for f in main.js preload.js renderer/*.js renderer/locales/*.js tools/*.js; do node --check "$f"; done
      - name: Translations complete
        run: npm run check
