name: Release

# A new release is published automatically when the version in package.json goes up
# (or when a tag like v1.4.2 is pushed). It builds:
#   - Runfjord-Setup-<version>.exe        Windows installer
#   - Runfjord-<version>-x86_64.AppImage  any Linux (used by install.sh)
#   - runfjord-x86_64.pkg.tar.xz          Arch / CachyOS:  sudo pacman -U <latest download URL>
on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Tools for the Arch package
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools
      - run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.pkg.tar.xz

  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install NSIS
        shell: pwsh
        run: |
          $makensis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) { throw "makensis.exe not found after installing NSIS" }
          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer
        shell: pwsh
        run: |
          node tools/gen-installer-langs.js
          & $env:MAKENSIS /V3 /INPUTCHARSET UTF8 "/DVERSION=${{ needs.version.outputs.version }}" installer/runfjord.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Runfjord-Setup-*.exe

  release:
    # publish whatever was built — the Linux files still ship if the Windows build fails
    needs: [version, linux, windows]
    if: always() && needs.version.outputs.release == 'true' && (needs.linux.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Runfjord ${{ needs.version.outputs.version }}
          files: out/*
          make_latest: true
          body: |
            ### Install

            **Arch / CachyOS / Manjaro** — one command:
            ```bash
            sudo pacman -U https://github.com/${{ github.repository }}/releases/latest/download/runfjord-x86_64.pkg.tar.xz
            ```

            **Any Linux** — one command, no password needed:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            ### Or download a file below and install it yourself

            | System | File | How to install |
            |---|---|---|
            | **Windows 10/11** | `Runfjord-Setup-${{ needs.version.outputs.version }}.exe` | Double-click it. If SmartScreen warns, click *More info → Run anyway*. |
            | **Arch / CachyOS / Manjaro** | `runfjord-x86_64.pkg.tar.xz` | In the folder you saved it to: `sudo pacman -U runfjord-x86_64.pkg.tar.xz` |
            | **Any Linux** | `Runfjord-${{ needs.version.outputs.version }}-x86_64.AppImage` | `chmod +x Runfjord-*.AppImage` and run it (or right-click → Properties → *Allow executing*). |

            Uninstall: Windows → *Settings → Apps → Runfjord*; Arch → `sudo pacman -R runfjord`; one-command install → `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash -s -- --uninstall`.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what's new.
